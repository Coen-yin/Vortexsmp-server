
name: Set Up VortexSMP Discord

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Discord library
        run: python -m pip install -U discord.py

      - name: Create Discord channels and roles
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python setup_vortexsmp.py
